name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/package-ci.yaml

  publish:
    needs: [validate]
    if: startsWith(github.ref, 'refs/tags/v') && vars.RELEASE_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: npm-release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.source-commit }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.12.1
      - name: Download the successful build's exact artifact ID (also on failed-job reruns)
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact-id }}
          path: release-artifacts
          merge-multiple: true
      - name: Validate exact source, tag and all local bytes before publication
        run: node npm/release.mjs verify --manifest release-artifacts/manifest.json
      - name: Publish or resume exact immutable npm versions using trusted publishing
        shell: bash
        run: |
          set -o pipefail
          VERSION=$(node -p "require('./release-artifacts/manifest.json').version")
          TAG=latest
          if [[ "$VERSION" == *-* ]]; then TAG=next; fi
          node npm/release.mjs publish --manifest release-artifacts/manifest.json --tag "$TAG" --provenance 2>&1 | tee npm-publication.log
      - name: Publish or resume GitHub assets from the same verified artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -o pipefail
          node npm/github-release.mjs --manifest release-artifacts/manifest.json 2>&1 | tee github-publication.log
      - name: Preserve publication receipts for exact-artifact resume
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            npm-publication.log
            github-publication.log
            release-artifacts/manifest.json
          if-no-files-found: error
          retention-days: 30
