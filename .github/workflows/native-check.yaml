name: native-check

on:
  workflow_dispatch:
    inputs:
      artifact-id:
        description: Original release-packages artifact ID (not its name)
        required: true
        type: string
      run-id:
        description: Original release workflow run ID
        required: true
        type: string
      source-commit:
        description: Original full 40-character source SHA; dispatch at its original version tag
        required: true
        type: string
      source-ref:
        description: Original full version tag ref (refs/tags/vVERSION)
        required: true
        type: string
  workflow_call:
    inputs:
      artifact-id:
        required: true
        type: string
      run-id:
        required: true
        type: string
      source-commit:
        required: true
        type: string
      source-ref:
        required: true
        type: string
      public-registry:
        description: Read exact versions from npmjs instead of the local prepublication registry
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  native:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            os: darwin
            arch: x64
          - runner: macos-15
            os: darwin
            arch: arm64
          - runner: ubuntu-24.04
            os: linux
            arch: x64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
          - runner: windows-2025
            os: win32
            arch: x64
          - runner: windows-11-arm
            os: win32
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Bind caller and original artifact before checkout or download
        uses: actions/github-script@v7
        env:
          ARTIFACT_ID: ${{ inputs.artifact-id }}
          ORIGINAL_RUN_ID: ${{ inputs.run-id }}
          SOURCE_COMMIT: ${{ inputs.source-commit }}
          SOURCE_REF: ${{ inputs.source-ref }}
          PUBLIC_REGISTRY: ${{ github.event_name == 'workflow_dispatch' || inputs.public-registry }}
        with:
          script: |
            const assert = require('node:assert/strict');
            const { ARTIFACT_ID, ORIGINAL_RUN_ID, SOURCE_COMMIT, SOURCE_REF, PUBLIC_REGISTRY } = process.env;
            assert.match(ARTIFACT_ID, /^[1-9][0-9]*$/);
            assert.match(ORIGINAL_RUN_ID, /^[1-9][0-9]*$/);
            assert.ok(Number.isSafeInteger(Number(ARTIFACT_ID)) && Number.isSafeInteger(Number(ORIGINAL_RUN_ID)));
            assert.match(SOURCE_COMMIT, /^[a-f0-9]{40}$/);
            // Dispatch at the original ref. Never replace GITHUB_SHA/GITHUB_REF
            // with manifest data to make an unrelated caller appear to match.
            assert.equal(SOURCE_COMMIT, context.sha, 'dispatch/call must use the original source commit');
            assert.equal(SOURCE_REF, context.ref, 'dispatch/call must use the original source ref');
            if (PUBLIC_REGISTRY === 'true') {
              assert.match(SOURCE_REF, /^refs\/tags\/v/);
              const { data: run } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: Number(ORIGINAL_RUN_ID) });
              assert.equal(run.head_sha, SOURCE_COMMIT, 'original run/source mismatch');
              assert.equal(run.path, '.github/workflows/release.yaml');
              assert.equal(run.event, 'push');
            } else {
              assert.equal(ORIGINAL_RUN_ID, String(context.runId), 'local validation must consume its own build');
            }
            const { data: artifact } = await github.rest.actions.getArtifact({ ...context.repo, artifact_id: Number(ARTIFACT_ID) });
            assert.equal(artifact.id, Number(ARTIFACT_ID));
            assert.equal(artifact.expired, false, 'original artifact has expired; do not rebuild');
            assert.equal(artifact.workflow_run.id, Number(ORIGINAL_RUN_ID), 'artifact/run mismatch');
            assert.match(artifact.name, new RegExp(`^release-packages-${ORIGINAL_RUN_ID}-[1-9][0-9]*$`));
            if (PUBLIC_REGISTRY === 'true') {
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt, {
                ...context.repo, run_id: Number(ORIGINAL_RUN_ID),
                attempt_number: Number(artifact.name.split('-').at(-1)), per_page: 100,
              });
              assert.ok(jobs.some((job) => job.name === 'validate / gate' && job.conclusion === 'success'),
                'original artifact attempt must have passed the six-native validation gate');
            }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          architecture: ${{ matrix.arch }}
      - run: npm install --global npm@11.12.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ inputs.artifact-id }}
          run-id: ${{ inputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-artifacts
          merge-multiple: true
      - name: Assert native drivers and pinned tools
        shell: bash
        env:
          EXPECTED_OS: ${{ matrix.os }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          node -e "const a=require('node:assert/strict');a.equal(process.platform,process.env.EXPECTED_OS);a.equal(process.arch,process.env.EXPECTED_ARCH);a.equal(process.versions.node,'24.15.0')"
          bun -e "const a=require('node:assert/strict');a.equal(process.platform,process.env.EXPECTED_OS);a.equal(process.arch,process.env.EXPECTED_ARCH);a.equal(Bun.version,'1.4.2')"
          test "$(npm --version)" = '11.12.1'
      - name: Verify original source, tag version and every local artifact byte
        run: node npm/release.mjs verify --manifest release-artifacts/manifest.json
      - name: Restore original frontend and build only the native test fixture
        shell: bash
        run: |
          test ! -e frontend/dist
          cp -R release-artifacts/frontend-dist frontend/dist
          go build -o native-fixture${{ matrix.os == 'win32' && '.exe' || '' }} ./test/nativefixture
      - name: Exercise exact artifacts through npx, bunx and bunx --bun
        shell: bash
        env:
          PUBLIC_REGISTRY: ${{ github.event_name == 'workflow_dispatch' || inputs.public-registry }}
        run: |
          set -o pipefail
          registry_args=()
          if [[ "$PUBLIC_REGISTRY" == 'true' ]]; then
            registry_args=(--registry https://registry.npmjs.org)
          fi
          bun test/npm_native_smoke.mjs --manifest release-artifacts/manifest.json --fixture "$PWD/native-fixture${{ matrix.os == 'win32' && '.exe' || '' }}" "${registry_args[@]}" 2>&1 | tee native-receipt.log
      - name: Preserve native receipts including failures and cleanup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ (github.event_name == 'workflow_dispatch' || inputs.public-registry) && 'public' || 'local' }}-${{ matrix.os }}-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: native-receipt.log
          if-no-files-found: warn
          retention-days: 30
