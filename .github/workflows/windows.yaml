name: windows

on:
  pull_request:
  push:

jobs:
  gate-crosscompile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.7"

      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"

      - name: Build embedded frontend
        run: cd frontend && npm ci && npm run build

      - name: Cross-compile Windows amd64 and arm64
        env:
          CGO_ENABLED: "0"
        run: |
          GOOS=windows GOARCH=amd64 go build ./...
          GOOS=windows GOARCH=amd64 go vet ./...
          GOOS=windows GOARCH=arm64 go build ./...
          GOOS=windows GOARCH=arm64 go vet ./...

  probe-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"

      - name: Install omo CLI
        run: bun install -g omo-ai@5.0.0-0.beta.43

      - name: Record omo command form
        shell: pwsh
        run: |
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "## G2_OMO_FORM"
          $cmd = Get-Command omo -ErrorAction SilentlyContinue
          if (-not $cmd) {
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "omo: not found on PATH"
            exit 1
          }
          $path = $cmd.Source
          if (-not $path) { $path = $cmd.Path }
          $ext = [System.IO.Path]::GetExtension([string]$path).ToLowerInvariant()
          $form = "other"
          if ($ext -eq ".exe") { $form = "exe" }
          elseif ($ext -eq ".cmd" -or $ext -eq ".bat") { $form = "cmd/bat shim" }
          elseif ($ext -eq "") { $form = "extensionless" }
          Write-Output "G2 path: $path"
          Write-Output "G2 form: $form"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "path: $path"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "form: $form"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.7"

      - name: Build real server with embedded frontend
        shell: pwsh
        env:
          npm_config_foreground_scripts: "true"
          npm_config_loglevel: verbose
        run: |
          Write-Output "build environment: PowerShell=$($PSVersionTable.PSVersion) cwd=$PWD"
          Get-Command node, npm, go -All | Select-Object Name, CommandType, Source | Format-Table -AutoSize
          Write-Output "PATH=$env:PATH"
          Write-Output "npm_config_ignore_scripts=$env:npm_config_ignore_scripts"
          Push-Location frontend
          Write-Output "BEGIN npm ci"
          npm ci
          Write-Output "END npm ci exit=$LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output "BEGIN npm run build"
          npm run build
          Write-Output "END npm run build exit=$LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          Write-Output "BEGIN go build -o omo-webchat.exe ./cmd/server"
          go build -o omo-webchat.exe ./cmd/server
          Write-Output "END go build -o omo-webchat.exe ./cmd/server exit=$LASTEXITCODE"
          exit $LASTEXITCODE

      - name: Record pinned runtimes
        shell: pwsh
        run: |
          go version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun --version
          exit $LASTEXITCODE

      - name: Real production daemon lifecycle and server HTTP
        shell: pwsh
        run: |
          & go run ./test/windowsprobe -server .\omo-webchat.exe 2>&1 | Tee-Object -FilePath probe-production.txt
          $probeExit = $LASTEXITCODE
          if (Test-Path -LiteralPath probe-production.txt) {
            Get-Content -LiteralPath probe-production.txt | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }

          exit $probeExit

      - name: Real omo transport loss and reconnect
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          & go test -tags=realomo ./internal/omorpc -run '^TestWindowsRealOmoReconnect$' -count=1 -v -timeout=2m 2>&1 | Tee-Object -FilePath probe-reconnect.txt
          $probeExit = $LASTEXITCODE
          if (Test-Path -LiteralPath probe-reconnect.txt) {
            Get-Content -LiteralPath probe-reconnect.txt | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }
          exit $probeExit

      - name: Real omo reconnect explicitly on node
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          OMORPC_REAL_RUNTIME: node
        run: |
          & go test -tags=realomo ./internal/omorpc -run '^TestWindowsRealOmoReconnectTrace$' -count=1 -v -timeout=3m 2>&1 | Tee-Object -FilePath probe-reconnect-node.txt
          $probeExit = $LASTEXITCODE
          if (Test-Path -LiteralPath probe-reconnect-node.txt) {
            Get-Content -LiteralPath probe-reconnect-node.txt | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }
          exit $probeExit

      - name: Real omo reconnect explicitly on bun
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          OMORPC_REAL_RUNTIME: bun
        run: |
          & go test -tags=realomo ./internal/omorpc -run '^TestWindowsRealOmoReconnect$' -count=1 -v -timeout=2m 2>&1 | Tee-Object -FilePath probe-reconnect-bun.txt
          $probeExit = $LASTEXITCODE
          if (Test-Path -LiteralPath probe-reconnect-bun.txt) {
            Get-Content -LiteralPath probe-reconnect-bun.txt | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }
          exit $probeExit

      - name: Compare actual packaged extension commands across runtimes
        shell: pwsh
        run: |
          $baseline = $null
          foreach ($file in @('probe-reconnect.txt', 'probe-reconnect-node.txt', 'probe-reconnect-bun.txt')) {
            $found = [regex]::Matches((Get-Content -LiteralPath $file -Raw), 'extension command parity: (\[.*\])')
            if ($found.Count -ne 1) { throw "Expected one correlated command inventory in $file" }
            $commands = @($found[0].Groups[1].Value | ConvertFrom-Json)
            if ($commands.Count -eq 0) { throw "No packaged extension commands in $file" }
            if ($null -ne $baseline -and @(Compare-Object $baseline $commands).Count -ne 0) {
              throw "Packaged extension command mismatch in $file"
            }
            $baseline = $commands
          }
          Write-Output "extension parity: automatic/node/bun identical ($($baseline.Count) packaged commands)"

      - name: Production named-pipe contracts
        shell: pwsh
        run: go test ./internal/omorpc -count=1 -v -timeout=2m

      - name: Production server readiness contract
        shell: pwsh
        run: go test ./test/windowsprobe -count=1 -v -timeout=2m

      - name: Windows lock tests
        shell: pwsh
        run: go test ./internal/omorpc/ -count=1 -timeout=2m -run TestEnsureLock

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-production-evidence
          path: |
            probe-production.txt
            probe-reconnect.txt
            probe-reconnect-node.txt
            probe-reconnect-bun.txt

  npm-omo-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.7"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - name: Install omo through npm into a prefix with spaces
        shell: pwsh
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP 'npm prefix & spaces'
          npm install --global --prefix "$prefix" omo-ai@5.0.0-0.beta.43
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $prefix | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: npm launcher resolution, argv and native executable contracts
        shell: pwsh
        run: go test ./internal/omorpc -run 'Test(ResolveOmo|Npm|SupervisorExec)' -count=1 -v
      - name: Real npm daemon startup, reuse, sessions and owned teardown
        shell: pwsh
        run: go test -tags=realomo ./internal/omorpc -run '^TestWindowsNpmOmoLifecycle$' -count=1 -v -timeout=3m

  smoke-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.7"

      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"

      - name: Build embedded frontend
        run: cd frontend && npm ci && npm run build

      - name: Complete Windows Go suite
        shell: pwsh
        run: go test ./... -count=1 -timeout=3m

      - name: Installer contracts (Windows PowerShell 5.1)
        shell: powershell
        run: powershell.exe -NoProfile -File test/install_ps1_test.ps1

      - name: Installer contracts (PowerShell 7)
        shell: pwsh
        run: pwsh -NoProfile -File test/install_ps1_test.ps1

      - name: Installer Windows-only mutation proof (5.1 and 7)
        shell: pwsh
        run: |
          powershell.exe -NoProfile -File test/installer_mutation_test.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File test/installer_mutation_test.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
