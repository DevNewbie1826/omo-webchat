name: windows

on:
  pull_request:
  push:

jobs:
  gate-crosscompile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build embedded frontend
        run: cd frontend && npm ci && npm run build

      - name: Cross-compile Windows amd64
        env:
          CGO_ENABLED: "0"
        run: |
          GOOS=windows GOARCH=amd64 go build ./...
          GOOS=windows GOARCH=amd64 go vet ./...

  probe-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install omo CLI
        continue-on-error: true
        run: bun install -g omo-ai@beta

      - name: Record omo command form
        shell: pwsh
        run: |
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "## G2_OMO_FORM"
          $cmd = Get-Command omo -ErrorAction SilentlyContinue
          if (-not $cmd) {
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "omo: not found on PATH"
            exit 0
          }
          $path = $cmd.Source
          if (-not $path) { $path = $cmd.Path }
          $ext = [System.IO.Path]::GetExtension([string]$path).ToLowerInvariant()
          $form = "other"
          if ($ext -eq ".exe") { $form = "exe" }
          elseif ($ext -eq ".cmd" -or $ext -eq ".bat") { $form = "cmd/bat shim" }
          elseif ($ext -eq "") { $form = "extensionless" }
          Write-Output "G2 path: $path"
          Write-Output "G2 form: $form"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "path: $path"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "form: $form"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Windows lock tests
        shell: pwsh
        run: go test ./internal/omorpc/ -count=1 -run TestEnsureLock

      - name: Probe AF_UNIX RPC
        continue-on-error: true
        shell: pwsh
        run: |
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "## G1_AF_UNIX"
          & go run ./test/windowsprobe 2>&1 | Tee-Object -FilePath probe-g1.txt
          if (Test-Path -LiteralPath probe-g1.txt) {
            Get-Content -LiteralPath probe-g1.txt | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }

  smoke-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build embedded frontend
        run: cd frontend && npm ci && npm run build

      - name: Windows procexec tests
        shell: pwsh
        run: go test ./internal/procexec/ -count=1

      - name: Windows omorpc tests
        shell: pwsh
        run: go test ./internal/omorpc/ -count=1 -run TestResolve

      - name: Server smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          go build -o omo-webchat.exe ./cmd/server
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Join-Path (Get-Location) 'omo-webchat.exe'
          $proc = Start-Process -FilePath $exe -ArgumentList '--password','devsmoke123','--port','18099' -PassThru -NoNewWindow
          if (-not $proc) { throw 'Start-Process returned no process' }
          $status = 0
          try {
            $readyDeadline = [datetime]::UtcNow.AddSeconds(30)
            while ([datetime]::UtcNow -lt $readyDeadline) {
              try {
                $resp = Invoke-WebRequest -Uri 'http://127.0.0.1:18099/' -UseBasicParsing -TimeoutSec 2
                $status = [int]$resp.StatusCode
                if ($status -eq 200) { break }
              } catch {
                $status = 0
              }
            }
            if ($status -ne 200) {
              throw "server did not return HTTP 200 within deadline (last status=$status)"
            }
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            try { & taskkill.exe /T /F /PID $proc.Id | Out-Null } catch {}
          }
          $freeDeadline = [datetime]::UtcNow.AddSeconds(15)
          $listening = $true
          while ([datetime]::UtcNow -lt $freeDeadline) {
            $client = [System.Net.Sockets.TcpClient]::new()
            try {
              $iar = $client.BeginConnect('127.0.0.1', 18099, $null, $null)
              if (-not $iar.AsyncWaitHandle.WaitOne(200, $false)) {
                continue
              }
              try {
                $client.EndConnect($iar)
              } catch {
                $listening = $false
                break
              }
            } catch {
              $listening = $false
              break
            } finally {
              $client.Dispose()
            }
          }
          if ($listening) { throw 'port 18099 still accepting connections after stop' }
          Write-Output "SMOKE=PASS status=$status"
