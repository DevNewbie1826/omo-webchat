name: windows

on:
  pull_request:
  push:

jobs:
  gate-crosscompile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.7"

      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"

      - name: Build embedded frontend
        run: cd frontend && npm ci && npm run build

      - name: Cross-compile Windows amd64 and arm64
        env:
          CGO_ENABLED: "0"
        run: |
          GOOS=windows GOARCH=amd64 go build ./...
          GOOS=windows GOARCH=amd64 go vet ./...
          GOOS=windows GOARCH=arm64 go build ./...
          GOOS=windows GOARCH=arm64 go vet ./...

  probe-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"

      - name: Install omo CLI
        run: bun install -g omo-ai@5.0.0-0.beta.43

      - name: Record omo command form
        shell: pwsh
        run: |
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "## G2_OMO_FORM"
          $cmd = Get-Command omo -ErrorAction SilentlyContinue
          if (-not $cmd) {
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "omo: not found on PATH"
            exit 1
          }
          $path = $cmd.Source
          if (-not $path) { $path = $cmd.Path }
          $ext = [System.IO.Path]::GetExtension([string]$path).ToLowerInvariant()
          $form = "other"
          if ($ext -eq ".exe") { $form = "exe" }
          elseif ($ext -eq ".cmd" -or $ext -eq ".bat") { $form = "cmd/bat shim" }
          elseif ($ext -eq "") { $form = "extensionless" }
          Write-Output "G2 path: $path"
          Write-Output "G2 form: $form"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "path: $path"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "form: $form"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.7"

      - name: Build real server with embedded frontend
        shell: pwsh
        run: |
          Push-Location frontend
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          go build -o omo-webchat.exe ./cmd/server
          exit $LASTEXITCODE

      - name: Record pinned runtimes
        shell: pwsh
        run: |
          go version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun --version
          exit $LASTEXITCODE

      - name: Real production daemon lifecycle and server HTTP
        shell: pwsh
        run: |
          & go run ./test/windowsprobe -server .\omo-webchat.exe 2>&1 | Tee-Object -FilePath probe-production.txt
          $probeExit = $LASTEXITCODE
          if (Test-Path -LiteralPath probe-production.txt) {
            Get-Content -LiteralPath probe-production.txt | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }

          exit $probeExit

      - name: Real omo transport loss and reconnect
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          & go test -tags=realomo ./internal/omorpc -run '^TestWindowsRealOmoReconnect$' -count=1 -v -timeout=2m 2>&1 | Tee-Object -FilePath probe-reconnect.txt
          $probeExit = $LASTEXITCODE
          if (Test-Path -LiteralPath probe-reconnect.txt) {
            Get-Content -LiteralPath probe-reconnect.txt | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }
          exit $probeExit

      - name: Real omo reconnect explicitly on node
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          OMORPC_REAL_RUNTIME: node
        run: |
          & go test -tags=realomo ./internal/omorpc -run '^TestWindowsRealOmoReconnect$' -count=1 -v -timeout=2m 2>&1 | Tee-Object -FilePath probe-reconnect-node.txt
          $probeExit = $LASTEXITCODE
          if (Test-Path -LiteralPath probe-reconnect-node.txt) {
            Get-Content -LiteralPath probe-reconnect-node.txt | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }
          exit $probeExit

      - name: Real omo reconnect explicitly on bun
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          OMORPC_REAL_RUNTIME: bun
        run: |
          & go test -tags=realomo ./internal/omorpc -run '^TestWindowsRealOmoReconnect$' -count=1 -v -timeout=2m 2>&1 | Tee-Object -FilePath probe-reconnect-bun.txt
          $probeExit = $LASTEXITCODE
          if (Test-Path -LiteralPath probe-reconnect-bun.txt) {
            Get-Content -LiteralPath probe-reconnect-bun.txt | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }
          exit $probeExit

      - name: Production named-pipe contracts
        shell: pwsh
        run: go test ./internal/omorpc -count=1 -v -timeout=2m

      - name: Production server readiness contract
        shell: pwsh
        run: go test ./test/windowsprobe -count=1 -v -timeout=2m

      - name: Windows lock tests
        shell: pwsh
        run: go test ./internal/omorpc/ -count=1 -timeout=2m -run TestEnsureLock

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-production-evidence
          path: |
            probe-production.txt
            probe-reconnect.txt
            probe-reconnect-node.txt
            probe-reconnect-bun.txt

  smoke-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.7"

      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"

      - name: Build embedded frontend
        run: cd frontend && npm ci && npm run build

      - name: Windows procexec tests
        shell: pwsh
        run: go test ./internal/procexec/ -count=1

      - name: Windows omorpc tests
        shell: pwsh
        run: go test ./internal/omorpc/ -count=1 -timeout=2m

      - name: Server smoke
        shell: pwsh
        run: go test ./test/smoke/ -count=1 -v

      - name: Installer contracts (Windows PowerShell 5.1)
        shell: powershell
        run: powershell.exe -NoProfile -File test/install_ps1_test.ps1

      - name: Installer contracts (PowerShell 7)
        shell: pwsh
        run: pwsh -NoProfile -File test/install_ps1_test.ps1

      - name: Installer Windows-only mutation proof (5.1 and 7)
        shell: pwsh
        run: |
          powershell.exe -NoProfile -File test/installer_mutation_test.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File test/installer_mutation_test.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
